---
layout: default
title: Blog
---

<!DOCTYPE html>
<html>
    <main>

        <div class="container">
            <!-- Jekyll is built into Github Pages so it was the most logical and simplest way to get a blog going -->
            <h1>My Blog Posts:</h1>

                {% for post in site.posts %}
                    <article>
                        <p class="blog-date">{{ post.date | date: "%B %d, %Y" }}</p>

                        <h2>
                            <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
                        </h2>

                        <p>
                            {{ post.excerpt | strip_html | truncatewords: 30 }}
                        </p>

                        <p>
                            <a href="{{ post.url | relative_url }}">Read More →</a>
                        </p>
                    </article>
                {% endfor %}
        
        </div>
    </main>

</html>
