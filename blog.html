<!DOCTYPE html>
<html>
    <head>
        <title> My Personal Site </title>

        <meta name="description" content="My own little corner of the internet.">
        <meta name="author" content="Alex (not my real name)">
        <meta charset="UTF-8">
        <link href="./css/simple.css" rel="stylesheet">

         <!-- Add icon library -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    </head>
    <header>
        <h1> Alex's Corner of the Internet </h1>

        <!-- For some reason adding an id to div breaks the css styling. -->
        <!-- I couldn't figure this one out on how to fix so just going to get rid of the div-->
        
        <nav>
            <a href="./index.html" aria-current="page"> Home </a>
            <a href="./aboutme.html"> About Me </a>
            <a href="./projects.html"> Projects </a>
            <a href="./blog.html"> Blog </a>
        </nav>
    </header>

    <main>

        <div class="container">
            <!-- Jekyll is built into Github Pages so it was the most logical and simplest way to get a blog going -->
            <h1>My Blog Posts: </h1>

            <div class="blog-grid">
                {% for post in site.posts %}
                    <article class="blog-card">
                        <div class="blog-card-content">
                            <span class="blog-date">{{ post.date | date: "%B %d, %Y" }}</span>
                            
                            <h2 class="blog-title">
                                <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
                            </h2>
                            
                            <p class="blog-excerpt">
                                {{ post.excerpt | strip_html | truncatewords: 30 }}
                            </p>
                            
                            <a href="{{ post.url | relative_url }}" class="read-more">Read More &rarr;</a>
                        </div>
                    </article>
                {% endfor %}
            </div>
        </div>
    </main>

   <footer id="footer">
        <p> Made with love and Jekyll &#128151; </p>

        <p>
            <a href="https://github.com/dleto614" class="fa fa-github"></a>
            <a href="https://www.linkedin.com/in/dianalebeau" class="fa fa-linkedin"></a>
        </p>
    </footer>

</html>
